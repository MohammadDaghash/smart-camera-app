name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Run backend tests
        run: PYTHONPATH=. pytest -q

  frontend-js:
    name: Frontend JavaScript Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check inline page scripts
        run: |
          for file in frontend/*.html; do
            script_file="/tmp/$(basename "$file").js"
            sed -n '/<script>/,/<\/script>/p' "$file" | sed '1d;$d' > "$script_file"

            if [ -s "$script_file" ]; then
              node --check "$script_file"
            fi
          done

  file-lengths:
    name: File Length Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tracked files stay under 1000 lines
        run: |
          failed=0

          while IFS= read -r file; do
            lines=$(awk 'END { print NR }' "$file")

            if [ "$lines" -gt 1000 ]; then
              echo "$file has $lines lines"
              failed=1
            fi
          done < <(git ls-files)

          exit "$failed"
