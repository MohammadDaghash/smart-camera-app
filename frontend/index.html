<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Camera Live View</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: min(900px, 100%);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .status {
      margin: 0 0 20px;
      color: #15803d;
      font-weight: 700;
    }

    .status-panel {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 20px;
      padding: 16px 0;
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .status-item {
      min-width: 0;
    }

    .status-label {
      display: block;
      margin-bottom: 4px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-value {
      display: block;
      min-height: 24px;
      font-size: 18px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .status-value.ok {
      color: #15803d;
    }

    .status-value.warn {
      color: #b45309;
    }

    .status-value.error {
      color: #b91c1c;
    }

    .status-meta {
      margin: -8px 0 20px;
      color: #6b7280;
      font-size: 13px;
    }

    .events {
      margin: 0 0 20px;
    }

    .event-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #e5e7eb;
    }

    .event-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .event-message {
      font-weight: 700;
    }

    .event-time {
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
    }

    .event-empty {
      padding: 10px 0;
      color: #6b7280;
      border-bottom: 1px solid #e5e7eb;
    }

    img {
      display: block;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #111827;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .logout {
      font-size: 14px;
      font-weight: 700;
      color: #2563eb;
      text-decoration: none;
      white-space: nowrap;
    }

    .logout:hover {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      body {
        padding: 16px;
      }

      main {
        padding: 18px;
      }

      .header {
        align-items: flex-start;
      }

      .status-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 460px) {
      .status-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <h1>Smart Camera Live View</h1>
      <a class="logout" href="/logout">Log out</a>
    </div>
    <p class="status">Camera is live</p>
    <section class="status-panel" aria-label="Live camera status">
      <div class="status-item">
        <span class="status-label">Camera</span>
        <span class="status-value ok" id="cameraStatus">Live</span>
      </div>
      <div class="status-item">
        <span class="status-label">Faces</span>
        <span class="status-value" id="faceCount">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">Labels</span>
        <span class="status-value" id="faceLabels">None</span>
      </div>
      <div class="status-item">
        <span class="status-label">Motion</span>
        <span class="status-value" id="motionStatus">No motion</span>
      </div>
    </section>
    <p class="status-meta" id="statsUpdatedAt">Stats loading...</p>
    <section class="events" aria-label="Recent camera events">
      <h2>Recent Events</h2>
      <ul class="event-list" id="eventList">
        <li class="event-empty">No events yet</li>
      </ul>
    </section>
    <img src="/video" alt="Live webcam stream">
  </main>
  <script>
    const cameraStatus = document.getElementById("cameraStatus");
    const faceCount = document.getElementById("faceCount");
    const faceLabels = document.getElementById("faceLabels");
    const motionStatus = document.getElementById("motionStatus");
    const statsUpdatedAt = document.getElementById("statsUpdatedAt");
    const eventList = document.getElementById("eventList");

    function setValue(element, text, stateClass) {
      element.textContent = text;
      element.classList.remove("ok", "warn", "error");

      if (stateClass) {
        element.classList.add(stateClass);
      }
    }

    function formatLabels(labels) {
      if (!labels || labels.length === 0) {
        return "None";
      }

      return labels
        .map((label) => label.split(":")[0])
        .join(", ");
    }

    function formatEventTime(event) {
      if (!event.created_at) {
        return "";
      }

      return new Date(event.created_at * 1000).toLocaleTimeString();
    }

    function renderEvents(events) {
      eventList.replaceChildren();

      if (!events || events.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "event-empty";
        emptyItem.textContent = "No events yet";
        eventList.appendChild(emptyItem);
        return;
      }

      for (const event of events.slice(0, 10)) {
        const item = document.createElement("li");
        item.className = "event-item";

        const message = document.createElement("span");
        message.className = "event-message";
        message.textContent = event.message || "Event detected";

        const time = document.createElement("span");
        time.className = "event-time";
        time.textContent = formatEventTime(event);

        item.append(message, time);
        eventList.appendChild(item);
      }
    }

    async function updateStats() {
      try {
        const response = await fetch("/stats", { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Stats request failed: ${response.status}`);
        }

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error("Stats response was not JSON");
        }

        const stats = await response.json();
        const activeStreams = stats.camera?.active_streams || 0;
        const framesRead = stats.camera?.frames_read || 0;
        const faces = stats.analysis?.last_face_count || 0;
        const labels = formatLabels(stats.analysis?.last_labels);
        const motionActive = Boolean(stats.motion?.motion_active);

        if (activeStreams > 0 || framesRead > 0) {
          setValue(cameraStatus, "Live", "ok");
        } else {
          setValue(cameraStatus, "Waiting", "warn");
        }

        setValue(faceCount, String(faces), faces > 0 ? "ok" : "");
        setValue(faceLabels, labels, labels === "None" ? "" : "ok");
        setValue(motionStatus, motionActive ? "Detected" : "No motion", motionActive ? "warn" : "ok");
        renderEvents(stats.events || []);

        statsUpdatedAt.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        setValue(cameraStatus, "Unknown", "error");
        setValue(motionStatus, "Unknown", "error");
        statsUpdatedAt.textContent = "Stats unavailable";
        console.error(error);
      }
    }

    updateStats();
    setInterval(updateStats, 1000);
  </script>
</body>
</html>
