<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Review</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #17212b;
      background: #eef3f7;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
    }

    p {
      margin: 0;
      color: #506070;
      line-height: 1.5;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .nav-link,
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      background: #2563eb;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-link.secondary {
      background: #334155;
    }

    .toolbar,
    .status,
    .review-card,
    .empty-state {
      border: 1px solid #d8e0e8;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    select,
    input {
      min-height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      background: #ffffff;
      color: #17212b;
      font: inherit;
    }

    input[type="search"] {
      min-width: 180px;
    }

    .button-row,
    .action-row {
      display: flex;
      gap: 8px;
    }

    .action-row {
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .status-button {
      border: 1px solid #cbd5e1;
      color: #334155;
      background: #ffffff;
    }

    .status-button.active,
    .status-button:hover {
      color: #ffffff;
      background: #2563eb;
    }

    .status-button.false-positive.active,
    .status-button.false-positive:hover {
      background: #dc2626;
    }

    .status {
      padding: 14px 16px;
      margin-bottom: 14px;
      color: #334155;
    }

    .review-list {
      display: grid;
      gap: 14px;
    }

    .review-card {
      padding: 16px;
    }

    .review-card.alert {
      border-left: 6px solid #dc2626;
    }

    .review-card.detection {
      border-left: 6px solid #2563eb;
    }

    .review-card.info {
      border-left: 6px solid #64748b;
    }

    .review-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .summary {
      color: #0f172a;
      font-size: 20px;
      font-weight: 800;
    }

    .timestamp {
      margin-top: 4px;
      color: #64748b;
      font-size: 14px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .pill {
      border-radius: 999px;
      padding: 6px 10px;
      background: #e2e8f0;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .pill.alert {
      background: #fee2e2;
      color: #991b1b;
    }

    .pill.detection {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pill.info {
      background: #e2e8f0;
      color: #334155;
    }

    .pill.new {
      background: #fef3c7;
      color: #92400e;
    }

    .pill.reviewed {
      background: #dcfce7;
      color: #166534;
    }

    .pill.false-positive {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-meta {
      color: #64748b;
      font-size: 13px;
    }

    .event-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .event-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 150px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      background: #f8fafc;
      color: #334155;
      font-size: 14px;
    }

    .event-type {
      font-weight: 800;
      text-transform: capitalize;
    }

    .event-message {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .event-time {
      text-align: right;
      color: #64748b;
    }

    .empty-state {
      padding: 28px;
      text-align: center;
    }

    @media (max-width: 720px) {
      header,
      .review-head {
        display: grid;
      }

      .nav {
        justify-content: flex-start;
      }

      .event-row {
        grid-template-columns: 1fr;
      }

      .event-time {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Activity Review</h1>
        <p>Grouped camera activity built from local motion, face, alert, and system events.</p>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="/">Live View</a>
        <a class="nav-link secondary" href="/history">History</a>
        <a class="nav-link secondary" href="/diagnostics">Diagnostics</a>
        <a class="nav-link secondary" href="/settings">Settings</a>
      </nav>
    </header>

    <section class="toolbar" aria-label="Review controls">
      <div class="controls">
        <label for="severityFilter">Severity</label>
        <select id="severityFilter">
          <option value="all">All</option>
          <option value="alert">Alert</option>
          <option value="detection">Detection</option>
          <option value="info">Info</option>
        </select>
        <label for="reviewStatusFilter">Status</label>
        <select id="reviewStatusFilter">
          <option value="all">All</option>
          <option value="new">New</option>
          <option value="reviewed">Reviewed</option>
          <option value="false_positive">False Positive</option>
        </select>
        <label for="labelFilter">Label</label>
        <input id="labelFilter" type="search" placeholder="Anonymous 1">
        <label for="startAt">From</label>
        <input id="startAt" type="datetime-local">
        <label for="endAt">To</label>
        <input id="endAt" type="datetime-local">
      </div>
      <div class="button-row">
        <button type="button" id="refreshButton">Refresh</button>
        <button type="button" id="clearButton">Clear</button>
      </div>
    </section>

    <section class="status" id="status">Loading review items...</section>
    <section class="review-list" id="reviewList" aria-label="Activity review items"></section>
  </main>

  <script>
    const statusElement = document.getElementById("status");
    const reviewList = document.getElementById("reviewList");
    const severityFilter = document.getElementById("severityFilter");
    const reviewStatusFilter = document.getElementById("reviewStatusFilter");
    const labelFilter = document.getElementById("labelFilter");
    const startAt = document.getElementById("startAt");
    const endAt = document.getElementById("endAt");
    const refreshButton = document.getElementById("refreshButton");
    const clearButton = document.getElementById("clearButton");
    let latestItems = [];

    function formatDate(seconds) {
      return new Date(seconds * 1000).toLocaleString();
    }

    function formatDuration(seconds) {
      if (seconds < 1) {
        return "instant";
      }

      if (seconds < 60) {
        return `${Math.round(seconds)}s`;
      }

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.round(seconds % 60);
      return `${minutes}m ${remainingSeconds}s`;
    }

    function timestampFromInput(input) {
      if (!input.value) {
        return "";
      }

      return Math.floor(new Date(input.value).getTime() / 1000);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;",
      }[character]));
    }

    function severityClass(severity) {
      return ["alert", "detection", "info"].includes(severity) ? severity : "info";
    }

    function reviewStatusClass(status) {
      if (["new", "reviewed", "false_positive"].includes(status)) {
        return status.replace("_", "-");
      }

      return "new";
    }

    function formatReviewStatus(status) {
      const labels = {
        new: "New",
        reviewed: "Reviewed",
        false_positive: "False Positive",
      };

      return labels[status] || "New";
    }

    function renderPills(item) {
      const labels = item.labels.length ? item.labels : ["No labels"];
      const typePills = item.types.map((type) => (
        `<span class="pill">${escapeHtml(type)}</span>`
      ));
      const labelPills = labels.map((label) => (
        `<span class="pill">${escapeHtml(label)}</span>`
      ));
      const severity = severityClass(item.severity);
      const reviewStatus = item.review_status || "new";

      return [
        `<span class="pill ${severity}">${severity}</span>`,
        `<span class="pill ${reviewStatusClass(reviewStatus)}">${formatReviewStatus(reviewStatus)}</span>`,
        ...typePills,
        ...labelPills,
      ].join("");
    }

    function renderStatusActions(item) {
      const reviewStatus = item.review_status || "new";
      const updatedAt = item.review_status_updated_at
        ? `Updated ${formatDate(item.review_status_updated_at)}`
        : "Not reviewed yet";
      const actions = [
        ["reviewed", "Mark Reviewed"],
        ["false_positive", "False Positive"],
        ["new", "Reset"],
      ];

      const buttons = actions.map(([status, label]) => {
        const active = reviewStatus === status ? " active" : "";
        const statusClass = reviewStatusClass(status);
        return `<button type="button" class="status-button ${statusClass}${active}" data-review-id="${escapeHtml(item.id)}" data-status="${status}">${label}</button>`;
      }).join("");

      return `
        <div class="action-row">${buttons}</div>
        <div class="status-meta">${updatedAt}</div>
      `;
    }

    function renderEvents(events) {
      return events.map((event) => `
        <div class="event-row">
          <div class="event-type">${escapeHtml(event.type)}</div>
          <div class="event-message">${escapeHtml(event.message)}</div>
          <div class="event-time">${formatDate(event.created_at)}</div>
        </div>
      `).join("");
    }

    function renderItems() {
      const selectedSeverity = severityFilter.value;
      const selectedReviewStatus = reviewStatusFilter.value;
      const visibleItems = latestItems.filter((item) => (
        (selectedSeverity === "all" || item.severity === selectedSeverity)
        && (
          selectedReviewStatus === "all"
          || (item.review_status || "new") === selectedReviewStatus
        )
      ));

      if (!visibleItems.length) {
        reviewList.innerHTML = `
          <div class="empty-state">
            <strong>No review items found.</strong>
            <p>Start the live stream, create motion or face events, then refresh.</p>
          </div>
        `;
        return;
      }

      reviewList.innerHTML = visibleItems.map((item) => `
        <article class="review-card ${severityClass(item.severity)}">
          <div class="review-head">
            <div>
              <div class="summary">${escapeHtml(item.summary)}</div>
              <div class="timestamp">${formatDate(item.start_at)} | ${formatDuration(item.duration_seconds)}</div>
            </div>
            <div class="pill">${item.event_count} event${item.event_count === 1 ? "" : "s"}</div>
          </div>
          <div class="pill-row">${renderPills(item)}</div>
          <div class="event-list">${renderEvents(item.events)}</div>
          ${renderStatusActions(item)}
        </article>
      `).join("");

      wireStatusButtons();
    }

    function wireStatusButtons() {
      reviewList.querySelectorAll("[data-review-id][data-status]").forEach((button) => {
        button.addEventListener("click", () => {
          updateReviewStatus(button.dataset.reviewId, button.dataset.status);
        });
      });
    }

    async function updateReviewStatus(reviewId, reviewStatus) {
      statusElement.textContent = "Saving review status...";

      try {
        const response = await fetch(`/api/review/${encodeURIComponent(reviewId)}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ status: reviewStatus }),
        });

        if (!response.ok) {
          throw new Error(`Status update failed: ${response.status}`);
        }

        const updatedStatus = await response.json();
        latestItems = latestItems.map((item) => (
          item.id === reviewId
            ? {
                ...item,
                review_status: updatedStatus.status,
                review_status_updated_at: updatedStatus.updated_at,
              }
            : item
        ));
        statusElement.textContent = "Review status saved.";
        renderItems();
      } catch (error) {
        console.error(error);
        statusElement.textContent = "Could not save review status. Check the backend terminal.";
      }
    }

    async function loadReview() {
      statusElement.textContent = "Loading review items...";
      const params = new URLSearchParams({ limit: "200" });
      const label = labelFilter.value.trim();
      const startTimestamp = timestampFromInput(startAt);
      const endTimestamp = timestampFromInput(endAt);

      if (label) {
        params.set("label", label);
      }

      if (startTimestamp) {
        params.set("start_at", startTimestamp);
      }

      if (endTimestamp) {
        params.set("end_at", endTimestamp);
      }

      try {
        const response = await fetch(`/api/review?${params}`, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Review request failed: ${response.status}`);
        }

        const data = await response.json();
        latestItems = data.items || [];
        statusElement.textContent = `${latestItems.length} review item${latestItems.length === 1 ? "" : "s"} loaded. Events within ${data.settings.event_gap_seconds}s are grouped together.`;
        renderItems();
      } catch (error) {
        console.error(error);
        latestItems = [];
        statusElement.textContent = "Activity review unavailable. Check the backend terminal.";
        renderItems();
      }
    }

    function clearFilters() {
      severityFilter.value = "all";
      reviewStatusFilter.value = "all";
      labelFilter.value = "";
      startAt.value = "";
      endAt.value = "";
      loadReview();
    }

    severityFilter.addEventListener("change", renderItems);
    reviewStatusFilter.addEventListener("change", renderItems);
    labelFilter.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        loadReview();
      }
    });
    startAt.addEventListener("change", loadReview);
    endAt.addEventListener("change", loadReview);
    refreshButton.addEventListener("click", loadReview);
    clearButton.addEventListener("click", clearFilters);

    loadReview();
  </script>
</body>
</html>
